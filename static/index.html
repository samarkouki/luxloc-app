const API = "/api/v1";
if(!window._luxlocPhotos) window._luxlocPhotos = {};
async function api(path, opts = {}) {
  const res = await fetch(`${API}${path}`, {
    headers: { "Content-Type": "application/json", ...opts.headers },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || res.statusText); }
  return res.json();
}

function Icon({name, size=28, color="currentColor", stroke=1.4}) {

}

// Révélation au scroll — fait apparaître les sections en glissant vers le haut
function Reveal({children, delay=0, style={}}) {
  const ref = React.useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    if(!ref.current) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting){setInView(true); obs.disconnect();}});
    }, {threshold:0.12, rootMargin:"0px 0px -60px 0px"});
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return <div ref={ref} className={"reveal"+(inView?" in":"")} style={{...style, transitionDelay:`${delay}s`}}>{children}</div>;
}

// Parallaxe doux : la cible suit le curseur avec un effet d'inertie
function useMouseTilt(strength=12) {
  const ref = React.useRef(null);
  useEffect(() => {
    const el = ref.current;
    if(!el) return;
    const parent = el.closest("section") || el.parentElement;
    const onMove = (e) => {
      const r = parent.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width - 0.5) * 2;
      const y = ((e.clientY - r.top) / r.height - 0.5) * 2;
      el.style.transform = `perspective(1200px) rotateY(${x*strength*0.4}deg) rotateX(${-y*strength*0.4}deg) translateX(${x*strength}px) translateY(${y*strength}px)`;
    };
    const onLeave = () => { el.style.transform = ""; };
    parent.addEventListener("mousemove", onMove);
    parent.addEventListener("mouseleave", onLeave);
    return () => { parent.removeEventListener("mousemove", onMove); parent.removeEventListener("mouseleave", onLeave); };
  }, [strength]);
  return ref;
}

// Hook : position de défilement courante
function useScrollY() {
  const [y, setY] = useState(0);
  useEffect(() => {
    let raf;
    const onScroll = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => setY(window.scrollY));
    };
    window.addEventListener("scroll", onScroll, {passive:true});
    return () => { window.removeEventListener("scroll", onScroll); cancelAnimationFrame(raf); };
  }, []);
  return y;
}

// Compteur animé déclenché à l'entrée dans la vue
function Counter({value, decimals=0, prefix="", suffix="", duration=1700}) {
  const [v, setV] = useState(0);
  const ref = React.useRef(null);
  const [started, setStarted] = useState(false);
  useEffect(() => {
    if(!ref.current) return;
    const obs = new IntersectionObserver(e => { if(e[0].isIntersecting){setStarted(true); obs.disconnect();}}, {threshold:0.3});
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  useEffect(() => {
    if(!started) return;
    let t0, raf;
    const step = (t) => {
      if(!t0) t0 = t;
      const p = Math.min(1, (t - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setV(value * eased);
      if(p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [started, value, duration]);
  return <span ref={ref}>{prefix}{decimals===0 ? Math.floor(v) : v.toFixed(decimals)}{suffix}</span>;
}

// Barre de progression de défilement — filet doré au sommet de l'écran
function ScrollProgress() {
  const [p, setP] = useState(0);
  useEffect(() => {
    const update = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      setP(h > 0 ? Math.min(1, window.scrollY / h) : 0);
    };
    update();
    window.addEventListener("scroll", update, {passive:true});
    window.addEventListener("resize", update);
    return () => { window.removeEventListener("scroll", update); window.removeEventListener("resize", update); };
  }, []);
  return <div style={{position:"fixed",top:0,left:0,right:0,height:2,zIndex:100,background:"rgba(26,22,20,0.04)",pointerEvents:"none"}}>
    <div style={{height:"100%",width:`${p*100}%`,background:"linear-gradient(90deg,#C9A84C 0%,#8f7531 100%)",boxShadow:"0 0 12px rgba(201,168,76,0.5)"}}/>
  </div>;
}

    </div>
    {showWordmark && <div style={{display:"flex",flexDirection:"column",lineHeight:1}}>
      <span style={{fontFamily:"'Montserrat',sans-serif",fontSize:wordmarkSize,letterSpacing:"0.42em",fontWeight:500,color:"#1A1614",paddingRight:"0.42em"}}>LUXLOC</span>

    </div>}
  </div>;
}

// ═══ OWNER VERIFY ═══
function OwnerVerify({setScreen,setVerifResult,showToast,user}){
  const [step,setStep]=useState(0);
  const [photos,setPhotos]=useState([null,null,null,null]);
  const [idDoc,setIdDoc]=useState(null);
  const [invoice,setInvoice]=useState(null);
  const [brand,setBrand]=useState("");
  const [cat,setCat]=useState("");
  const [model,setModel]=useState("");
  const [price,setPrice]=useState("");
  const [analyzing,setAnalyzing]=useState(false);
  const [progress,setProgress]=useState(0);
  const [pLabel,setPLabel]=useState("");
  const [articleId,setArticleId]=useState(null);

  const handleFile = (idx) => {
    const input = document.createElement("input");
    input.type="file"; input.accept="image/*";
    input.onchange = (e) => {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => { const n=[...photos]; n[idx]=ev.target.result; setPhotos(n); };
      reader.readAsDataURL(file);
    };
    input.click();
  };

  const handleDocFile = (setter) => {
    const input = document.createElement("input");
    input.type="file"; input.accept="image/*,.pdf";
    input.onchange = (e) => {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => setter({name:file.name, data:ev.target.result, type:file.type});
      reader.readAsDataURL(file);
    };
    input.click();
  };

  const createArticle = async () => {
    try {
      const res = await api(`/articles/?owner_id=${user?user.id:1}`, { method:"POST", body:{ title:model||"Article de luxe", brand, model, category:cat, description:"Article mis en location via LUXLOC", price_per_day:parseFloat(price)||85, retail_price:parseFloat(price)*15||1200, condition:"Excellent" }});
      setArticleId(res.id);
      showToast(`✓ Article #${res.id} créé via API`);
      setStep(1);
    } catch(e) { showToast("✗ Erreur: "+e.message); }
  };

  const uploadPhotosAndDocs = async () => {
    try {
      const types=["overview","logo","label","stitching"];
      for(let i=0;i<types.length;i++){
        await api(`/articles/${articleId}/photos?photo_type=${types[i]}`,{
          method:"POST",
          body:{ image_data: photos[i] || null }
        });
      }
      // Envoi des documents de confiance (facture + pièce d'identité)
      await api(`/articles/${articleId}/documents`,{
        method:"POST",
        body:{
          invoice_data: invoice ? invoice.data : null,
          id_document_data: idDoc ? idDoc.data : null,
        }
      });
      if(window._luxlocPhotos===undefined) window._luxlocPhotos={};
      window._luxlocPhotos[articleId] = photos[0];
      showToast("✓ Photos + facture envoyées — analyse en cours");
      setStep(2);
    } catch(e) { showToast("✗ Erreur: "+e.message); }
  };

  const startAnalysis = async () => {
    setAnalyzing(true);
    const labels=["Vérification pièce d'identité...","Contrôle facture d'achat...","Contrôle qualité image...","Classification CNN globale...","Analyse du logo...","Vérification des coutures...","Analyse texture matériaux...","Lecture étiquette OCR...","Règles métier...","Calcul du score final..."];
    let p=0;
    const iv=setInterval(()=>{p+=Math.random()*12+4;if(p>95)p=95;setProgress(Math.round(p));setPLabel(labels[Math.min(Math.floor(p/10),labels.length-1)]);},400);
    try {
      const res = await api("/verification/launch",{method:"POST",body:{article_id:articleId,photo_ids:[1,2,3,4]}});
      clearInterval(iv); setProgress(100); setPLabel("Terminé !");
      showToast(`✓ Vérification terminée — Score: ${res.scores.global}`);
      setTimeout(()=>{ setVerifResult(res); setScreen(SCREENS.OWNER_RESULT); },800);
    } catch(e) { clearInterval(iv); showToast("✗ Erreur: "+e.message); }
  };

  const photoLabels=["Vue d'ensemble","Logo / Marque","Étiquette intérieure","Coutures & finitions"];
  const nbPhotos = photos.filter(Boolean).length;

  return <div style={{background:"#FAF8F4",minHeight:"calc(100vh - 64px)",color:"#1A1614"}}>
    <div style={{maxWidth:760,margin:"0 auto",padding:"48px clamp(16px,4vw,32px)"}}>
      <div style={{marginBottom:40}}>
        <div style={{fontSize:11,letterSpacing:4,color:"#C9A84C",marginBottom:12}}>PROPRIÉTAIRE — VÉRIFICATION<span className="api-badge">CONNECTÉ API</span></div>
        <h1 style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,fontSize:32,marginBottom:8}}>Authentifiez votre article</h1>
      </div>
      <div style={{display:"flex",gap:4,marginBottom:40}}>
        {["Informations","Documents","Photos article","Analyse IA"].map((s,i)=><div key={i} style={{flex:1}}><div style={{height:2,background:i<=step?"#C9A84C":"rgba(26,22,20,0.08)",transition:"background 0.4s",marginBottom:8}}/><div style={{fontSize:11,color:i<=step?"#C9A84C":"rgba(26,22,20,0.3)",letterSpacing:1}}>{s}</div></div>)}
      </div>

      {/* STEP 0 — Infos article */}
      {step===0&&<div style={{display:"grid",gap:20}}>
        <div><label style={{fontSize:12,color:"rgba(26,22,20,0.5)",display:"block",marginBottom:8}}>Catégorie</label>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8}}>
          {categories.map(c=><div key={c.id} onClick={()=>setCat(c.id)} style={{cursor:"pointer",padding:"24px 12px",textAlign:"center",border:`1px solid ${cat===c.id?"#C9A84C":"rgba(26,22,20,0.08)"}`,background:cat===c.id?"rgba(201,168,76,0.06)":"transparent",transition:"all 0.3s cubic-bezier(0.2,0.8,0.2,1)"}}><div style={{marginBottom:10,color:cat===c.id?"#C9A84C":"#1A1614",transform:cat===c.id?"scale(1.08)":"scale(1)",transition:"all 0.3s"}}><Icon name={c.icon} size={36} stroke={1.4}/></div><div style={{fontSize:12,fontWeight:500,color:cat===c.id?"#C9A84C":"rgba(26,22,20,0.55)"}}>{c.label}</div></div>)}
        </div></div>
        <div><label style={{fontSize:12,color:"rgba(26,22,20,0.5)",display:"block",marginBottom:8}}>Marque</label>
        <select value={brand} onChange={e=>setBrand(e.target.value)} style={{width:"100%",padding:"14px 16px",background:"rgba(26,22,20,0.04)",border:"1px solid rgba(26,22,20,0.1)",color:"#1A1614",fontSize:14}}><option value="">Sélectionner</option>{["Louis Vuitton","Gucci","Hermès","Chanel","Prada","Dior","Rolex","Cartier","Burberry"].map(b=><option key={b}>{b}</option>)}</select></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div><label style={{fontSize:12,color:"rgba(26,22,20,0.5)",display:"block",marginBottom:8}}>Modèle</label><input value={model} onChange={e=>setModel(e.target.value)} placeholder="ex: Speedy 25" style={{width:"100%",padding:"14px 16px",background:"rgba(26,22,20,0.04)",border:"1px solid rgba(26,22,20,0.1)",color:"#1A1614",fontSize:14,boxSizing:"border-box"}}/></div>
          <div><label style={{fontSize:12,color:"rgba(26,22,20,0.5)",display:"block",marginBottom:8}}>Prix / jour (€)</label><input value={price} onChange={e=>setPrice(e.target.value)} placeholder="ex: 85" style={{width:"100%",padding:"14px 16px",background:"rgba(26,22,20,0.04)",border:"1px solid rgba(26,22,20,0.1)",color:"#1A1614",fontSize:14,boxSizing:"border-box"}}/></div>
        </div>
        <button onClick={createArticle} disabled={!cat||!brand} style={{fontSize:13,letterSpacing:1,padding:"14px 0",border:"none",background:cat&&brand?"#C9A84C":"rgba(26,22,20,0.08)",color:cat&&brand?"#1A1614":"rgba(26,22,20,0.25)",cursor:cat&&brand?"pointer":"default",fontWeight:600}}>SUIVANT — DOCUMENTS →</button>
      </div>}

      {/* STEP 1 — Pièce d'identité + Facture */}
      {step===1&&<div style={{display:"grid",gap:24}}>
        <p style={{fontSize:13,color:"rgba(26,22,20,0.5)"}}>Pour garantir la confiance, nous vérifions l'identité du propriétaire et la preuve d'achat de l'article.</p>

        <div style={{border:"1px solid rgba(26,22,20,0.08)",padding:24}}>
          <div style={{fontSize:12,letterSpacing:2,color:"#C9A84C",marginBottom:16}}>PIÈCE D'IDENTITÉ</div>
          <p style={{fontSize:12,color:"rgba(26,22,20,0.35)",marginBottom:16}}>Carte d'identité, passeport ou permis de conduire</p>
          {idDoc?<div style={{display:"flex",alignItems:"center",gap:16,padding:16,background:"rgba(45,106,79,0.06)",border:"1px solid rgba(93,202,165,0.3)"}}>
            <div style={{width:48,height:48,background:"rgba(93,202,165,0.15)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>✓</div>
            <div><div style={{fontSize:13,color:"#5DCAA5",fontWeight:500}}>{idDoc.name}</div><div style={{fontSize:11,color:"rgba(26,22,20,0.35)"}}>Document chargé avec succès</div></div>
          </div>
          :<div onClick={()=>handleDocFile(setIdDoc)} style={{cursor:"pointer",padding:32,border:"1px dashed rgba(26,22,20,0.15)",textAlign:"center",transition:"all 0.3s"}}>
            <div style={{width:48,height:48,borderRadius:"50%",border:"1px solid rgba(26,22,20,0.15)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px"}}><div style={{color:"rgba(26,22,20,0.4)"}}><Icon name="document" size={22} stroke={1.4}/></div></div>
            <div style={{fontSize:13,color:"rgba(26,22,20,0.5)"}}>Cliquer pour charger votre pièce d'identité</div>
            <div style={{fontSize:10,color:"rgba(26,22,20,0.25)",marginTop:4}}>JPG, PNG ou PDF — 10 Mo max</div>
          </div>}
        </div>

        <div style={{border:"1px solid rgba(26,22,20,0.08)",padding:24}}>
          <div style={{fontSize:12,letterSpacing:2,color:"#C9A84C",marginBottom:16}}>FACTURE / PREUVE D'ACHAT</div>
          <p style={{fontSize:12,color:"rgba(26,22,20,0.35)",marginBottom:16}}>Facture d'origine, ticket de caisse ou certificat d'authenticité</p>
          {invoice?<div style={{display:"flex",alignItems:"center",gap:16,padding:16,background:"rgba(45,106,79,0.06)",border:"1px solid rgba(93,202,165,0.3)"}}>
            <div style={{width:48,height:48,background:"rgba(93,202,165,0.15)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>✓</div>
            <div><div style={{fontSize:13,color:"#5DCAA5",fontWeight:500}}>{invoice.name}</div><div style={{fontSize:11,color:"rgba(26,22,20,0.35)"}}>Document chargé avec succès</div></div>
          </div>
          :<div onClick={()=>handleDocFile(setInvoice)} style={{cursor:"pointer",padding:32,border:"1px dashed rgba(26,22,20,0.15)",textAlign:"center",transition:"all 0.3s"}}>
            <div style={{width:48,height:48,borderRadius:"50%",border:"1px solid rgba(26,22,20,0.15)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px"}}><div style={{color:"rgba(26,22,20,0.4)"}}><Icon name="receipt" size={22} stroke={1.4}/></div></div>
            <div style={{fontSize:13,color:"rgba(26,22,20,0.5)"}}>Cliquer pour charger la facture</div>
            <div style={{fontSize:10,color:"rgba(26,22,20,0.25)",marginTop:4}}>JPG, PNG ou PDF — 10 Mo max</div>
          </div>}
        </div>

        <button onClick={()=>setStep(2)} disabled={!idDoc||!invoice} style={{fontSize:13,letterSpacing:1,padding:"14px 0",border:"none",background:idDoc&&invoice?"#C9A84C":"rgba(26,22,20,0.08)",color:idDoc&&invoice?"#1A1614":"rgba(26,22,20,0.25)",cursor:idDoc&&invoice?"pointer":"default",fontWeight:600}}>SUIVANT — PHOTOS ARTICLE →</button>
      </div>}

      {/* STEP 2 — Photos de l'article */}
      {step===2&&!analyzing&&<div>
        <p style={{fontSize:13,color:"rgba(26,22,20,0.5)",marginBottom:24}}>Prenez 4 photos de votre article. Lumière naturelle, fond neutre de préférence.</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:24}}>
          {photoLabels.map((label,i)=><div key={i} onClick={()=>handleFile(i)} style={{cursor:"pointer",aspectRatio:"4/3",border:`1px ${photos[i]?"solid rgba(45,106,79,0.6)":"dashed rgba(26,22,20,0.15)"}`,background:photos[i]?"rgba(45,106,79,0.04)":"rgba(26,22,20,0.02)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",transition:"all 0.3s",overflow:"hidden",position:"relative"}}>
            {photos[i]?<>
              <img src={photos[i]} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",opacity:0.85}}/>
              <div style={{position:"relative",zIndex:2,background:"rgba(255,255,255,0.7)",padding:"6px 16px",borderRadius:4}}>
                <span style={{fontSize:12,color:"#5DCAA5",fontWeight:600}}>✓ {label}</span>
              </div>
            </>
            :<><div style={{width:40,height:40,borderRadius:"50%",border:"1px solid rgba(26,22,20,0.15)",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:8}}><div style={{color:"rgba(26,22,20,0.4)"}}><Icon name="camera" size={20} stroke={1.4}/></div></div>
            <span style={{fontSize:12,color:"rgba(26,22,20,0.35)"}}>{label}</span>
            <span style={{fontSize:10,color:"rgba(26,22,20,0.2)",marginTop:4}}>Cliquer pour ajouter</span></>}
          </div>)}
        </div>
        <div style={{fontSize:11,color:nbPhotos>=3?"#5DCAA5":"rgba(26,22,20,0.3)",marginBottom:12,textAlign:"center"}}>{nbPhotos}/4 photos ajoutées {nbPhotos>=3?"— prêt pour l'analyse":""}</div>
        <button onClick={()=>{uploadPhotosAndDocs().then(()=>{setStep(3);startAnalysis();});}} disabled={nbPhotos<3} style={{fontSize:13,letterSpacing:1,padding:"14px 0",border:"none",width:"100%",background:nbPhotos>=3?"#C9A84C":"rgba(26,22,20,0.08)",color:nbPhotos>=3?"#1A1614":"rgba(26,22,20,0.25)",cursor:nbPhotos>=3?"pointer":"default",fontWeight:600}}>LANCER LA VÉRIFICATION IA →</button>
      </div>}

      {/* STEP 3 — Analyse */}
      {step===3&&analyzing&&<div style={{textAlign:"center",padding:"60px 0"}}>
        <div style={{width:120,height:120,borderRadius:"50%",margin:"0 auto 32px",border:"2px solid rgba(201,168,76,0.2)",position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{position:"absolute",inset:0,borderRadius:"50%",border:"2px solid transparent",borderTopColor:"#C9A84C",animation:"spin 1s linear infinite"}}/>
          <span style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,fontSize:28,color:"#C9A84C"}}>{progress}%</span>
        </div>
        <div style={{fontSize:14,color:"#C9A84C",marginBottom:8}}>{pLabel}</div>
        <div style={{width:300,height:3,background:"rgba(26,22,20,0.06)",margin:"16px auto",borderRadius:2}}><div style={{height:"100%",background:"#C9A84C",borderRadius:2,width:`${progress}%`,transition:"width 0.3s"}}/></div>
        <div style={{fontSize:11,color:"rgba(26,22,20,0.3)",marginTop:16}}>Appel POST /api/v1/verification/launch en cours...</div>
      </div>}
    </div>
  </div>
}

// ═══ OWNER RESULT ═══
function OwnerResult({setScreen,verifResult,showToast}){
  const [loaded,setLoaded]=useState(false);
  const [validated,setValidated]=useState(false);
  useEffect(()=>{setTimeout(()=>setLoaded(true),200)},[]);
  const expertValidate = async () => {
    try {
      await api(`/verification/${verifResult.article_id}/expert-validate`,{method:"POST"});
      setValidated(true);
      showToast && showToast("✓ Article validé par l'expert — disponible à la location");
    } catch(e){ showToast && showToast("✗ "+e.message); }
  };
  if(!verifResult) return null;
  const sc=verifResult.scores;
  const scores=[{label:"Modèle IA (authenticité)",score:sc.cnn},{label:"Logo & monogramme",score:sc.logo},{label:"Coutures & finitions",score:sc.stitching},{label:"Texture matériaux",score:sc.texture},{label:"Étiquette & série",score:sc.label},{label:"Règles métier",score:sc.rules},{label:"Facture d'achat",score:sc.invoice}];
  const brandSig=verifResult.analysis&&verifResult.analysis.signature_marque;

  return <div style={{background:"#FAF8F4",minHeight:"calc(100vh - 64px)",color:"#1A1614"}}>
    <div style={{maxWidth:760,margin:"0 auto",padding:"48px clamp(16px,4vw,32px)"}}>
      <div style={{textAlign:"center",marginBottom:48,opacity:loaded?1:0,transform:loaded?"translateY(0)":"translateY(20px)",transition:"all 0.6s"}}>
        <div style={{width:100,height:100,borderRadius:"50%",margin:"0 auto 24px",background:"rgba(45,106,79,0.1)",border:"2px solid rgba(93,202,165,0.4)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:36,color:"#5DCAA5"}}>✓</span></div>
        <div style={{fontSize:11,letterSpacing:4,color:"#5DCAA5",marginBottom:12}}>{verifResult.verdict}<span className="api-badge">DONNÉES API</span></div>
        <h1 style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,fontSize:36,marginBottom:8}}>Score de confiance : <span style={{color:"#5DCAA5"}}>{sc.global}</span></h1>
        <p style={{fontSize:12,color:"rgba(26,22,20,0.35)"}}>Pipeline {verifResult.pipeline?.version} — {verifResult.pipeline?.processing_time_ms}ms</p>
      </div>
      <div style={{border:"1px solid rgba(26,22,20,0.08)",padding:28,marginBottom:24}}>
        <div style={{fontSize:12,letterSpacing:2,color:"#C9A84C",marginBottom:20}}>DÉTAIL PAR COMPOSANT (retourné par l'API)</div>
        {scores.map((s,i)=>{const v=Math.min(Math.max(s.score,0),1);const color=v>=0.85?"#5DCAA5":v>=0.7?"#C9A84C":"#EF9F27";return <div key={i} style={{display:"flex",alignItems:"center",gap:16,marginBottom:i<scores.length-1?16:0}}>
          <span style={{fontSize:13,color:"rgba(26,22,20,0.6)",minWidth:160}}>{s.label}</span>
          <div style={{flex:1,height:4,background:"rgba(26,22,20,0.06)",borderRadius:2}}><div style={{height:"100%",background:color,borderRadius:2,width:`${v*100}%`,transition:"width 1s ease-out",transitionDelay:`${i*0.15}s`}}/></div>
          <span style={{fontSize:14,fontWeight:600,color,minWidth:36,textAlign:"right"}}>{v.toFixed(2)}</span>
        </div>})}
      </div>
      {brandSig && <div style={{border:"1px solid rgba(201,168,76,0.25)",padding:24,marginBottom:24,background:"rgba(201,168,76,0.03)"}}>
        <div style={{fontSize:12,letterSpacing:2,color:"#C9A84C",marginBottom:14}}>SIGNATURE DE MARQUE — ANALYSE COULEUR</div>
        <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:12}}>
          <span style={{fontSize:28,fontFamily:"'Montserrat',sans-serif",color:brandSig.score>=0.75?"#5DCAA5":brandSig.score>=0.5?"#C9A84C":"#EF9F27"}}>{brandSig.score.toFixed(2)}</span>
          <span style={{fontSize:13,color:"rgba(26,22,20,0.65)"}}>{brandSig.verdict}</span>
        </div>
        <div style={{display:"flex",gap:20,fontSize:11,color:"rgba(26,22,20,0.45)"}}>
          {brandSig.details.justesse_rouge!==undefined&&<span>Justesse rouge : {brandSig.details.justesse_rouge}</span>}
          {brandSig.details.justesse_marine!==undefined&&<span>Justesse marine : {brandSig.details.justesse_marine}</span>}
        </div>
      </div>}

function getBrandVisual(brand) { return BRAND_VISUALS[brand] || {bg:"linear-gradient(145deg,rgba(109,46,70,0.3),rgba(201,168,76,0.15))",pattern:brand?brand.substring(0,2):"?",emoji:""}; }

// Badge de vérification — reflète le vrai statut renvoyé par l'API
function verifBadge(status, score) {
  const s = score!=null ? " — "+score.toFixed(2) : "";
  if(status==="verified") return {label:"VÉRIFIÉ IA"+s, color:"#5DCAA5", border:"rgba(93,202,165,0.35)", bg:"rgba(45,106,79,0.14)"};
  if(status==="review")   return {label:"EN EXAMEN EXPERT"+s, color:"#EF9F27", border:"rgba(239,159,39,0.4)", bg:"rgba(239,159,39,0.1)"};
  if(status==="rejected") return {label:"NON CERTIFIÉ", color:"#E08585", border:"rgba(224,133,133,0.4)", bg:"rgba(224,133,133,0.1)"};
  return null;
}
function ProductImage({brand,articleId,photo,hovered,style}) {
  const v = getBrandVisual(brand);
  // Priorité : photo renvoyée par le backend, puis cache mémoire local, puis visuel de marque
  const uploadedImg = photo || (window._luxlocPhotos && window._luxlocPhotos[articleId]);
  return <div style={{...style,background:v.bg,display:"flex",alignItems:"center",justifyContent:"center",position:"relative",transition:"all 0.4s",overflow:"hidden"}}>
    {uploadedImg ? <img src={uploadedImg} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",opacity:hovered?1:0.85,transform:hovered?"scale(1.06)":"scale(1)",transition:"opacity .4s ease,transform .6s cubic-bezier(.2,.8,.2,1)"}}/>
    : <>
      <div style={{position:"absolute",inset:0,opacity:0.08,background:"repeating-linear-gradient(45deg,transparent,transparent 35px,rgba(255,255,255,0.05) 35px,rgba(255,255,255,0.05) 70px)"}}/>
      <div style={{textAlign:"center",zIndex:1}}>
        <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"clamp(48px,8vw,82px)",fontWeight:200,color:"rgba(255,255,255,0.55)",letterSpacing:"-0.03em",textShadow:"0 2px 12px rgba(26,22,20,0.25)",lineHeight:1}}>{v.pattern}</div>
        <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:10,color:"rgba(255,255,255,0.35)",letterSpacing:5,marginTop:14,fontWeight:600}}>{brand?.toUpperCase()}</div>
      </div>
    </>}
  </div>
}

// ═══ ÉCRAN MODÈLE IA ═══
function ModelIA(){
  const [info,setInfo]=useState(null);
  const [err,setErr]=useState(false);
  useEffect(()=>{ api("/verification/model/info").then(setInfo).catch(()=>setErr(true)); },[]);

  const C={gold:"#C9A84C",cream:"#1A1614",muted:"rgba(26,22,20,0.45)",green:"#2D6A4F",berry:"#6D2E46",card:"rgba(26,22,20,0.03)",border:"rgba(26,22,20,0.08)"};

  if(err) return <div style={{maxWidth:1100,margin:"0 auto",padding:"48px 24px",color:C.muted}}>Impossible de charger la fiche du modèle.</div>;
  if(!info) return <div style={{maxWidth:1100,margin:"0 auto",padding:"48px 24px",color:C.muted}}>Chargement de la fiche modèle…</div>;
  if(!info.model_disponible) return <div style={{maxWidth:1100,margin:"0 auto",padding:"48px 24px",color:C.muted}}>Modèle non entraîné. Exécuter : python -m app.ml.train</div>;

  const m=info.metriques, cm=info.matrice_confusion;
  const pct=v=>(v*100).toFixed(1)+" %";
  const metricCards=[
    {l:"Accuracy",v:pct(m.accuracy)},
    {l:"Precision",v:pct(m.precision)},
    {l:"Recall",v:pct(m.recall)},
    {l:"F1-score",v:pct(m.f1_score)},
  ];
  const maxImp=Math.max(...info.importance_features.map(f=>f.importance));

  return <div style={{maxWidth:1100,margin:"0 auto",padding:"48px clamp(16px,4vw,24px)"}}>
    <div style={{display:"flex",alignItems:"baseline",gap:14,marginBottom:6}}>
      <h1 style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,fontSize:30,color:C.cream,margin:0}}>Modèle de détection de contrefaçon</h1>
      <span style={{fontSize:11,letterSpacing:1,padding:"3px 12px",background:"rgba(201,168,76,0.12)",color:C.gold,border:`1px solid rgba(201,168,76,0.3)`}}>RANDOM FOREST v1</span>
    </div>
    <p style={{color:C.muted,fontSize:13,marginBottom:32}}>{info.modele} · {info.jeu_de_donnees.taille_totale} échantillons ({info.jeu_de_donnees.entrainement} entraînement / {info.jeu_de_donnees.test} test) · 9 features d'image</p>

    {/* Métriques */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:14}}>
      {metricCards.map(c=>
        <div key={c.l} style={{padding:"20px",background:C.card,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:11,letterSpacing:1,color:C.muted,marginBottom:8}}>{c.l.toUpperCase()}</div>
          <div style={{fontSize:30,fontFamily:"'Montserrat',sans-serif",color:C.gold}}>{c.v}</div>
        </div>
      )}
    </div>
    <p style={{color:C.muted,fontSize:12,marginBottom:36}}>Validation croisée 5-fold — F1 : <span style={{color:C.cream}}>{m.f1_validation_croisee}</span></p>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:36}}>
      {/* Matrice de confusion */}
      <div>
        <h2 style={{fontFamily:"'Montserrat',sans-serif",fontSize:18,color:C.cream,marginBottom:14}}>Matrice de confusion</h2>
        <div style={{display:"grid",gridTemplateColumns:"70px 1fr 1fr",gap:6,fontSize:11}}>
          <div></div>
          <div style={{textAlign:"center",color:C.muted,paddingBottom:4}}>Prédit faux</div>
          <div style={{textAlign:"center",color:C.muted,paddingBottom:4}}>Prédit vrai</div>
          <div style={{display:"flex",alignItems:"center",color:C.muted}}>Réel faux</div>
          <div style={{background:"rgba(45,106,79,0.15)",border:`1px solid rgba(45,106,79,0.4)`,padding:"16px 0",textAlign:"center"}}>
            <div style={{fontSize:24,color:"#5DCAA5",fontWeight:600}}>{cm.vrais_negatifs}</div>
            <div style={{fontSize:10,color:C.muted}}>contrefaçons détectées</div>
          </div>
          <div style={{background:"rgba(163,45,45,0.12)",border:`1px solid rgba(163,45,45,0.35)`,padding:"16px 0",textAlign:"center"}}>
            <div style={{fontSize:24,color:"#E08585",fontWeight:600}}>{cm.faux_positifs}</div>
            <div style={{fontSize:10,color:C.muted}}>super fakes manqués</div>
          </div>
          <div style={{display:"flex",alignItems:"center",color:C.muted}}>Réel vrai</div>
          <div style={{background:"rgba(163,45,45,0.12)",border:`1px solid rgba(163,45,45,0.35)`,padding:"16px 0",textAlign:"center"}}>
            <div style={{fontSize:24,color:"#E08585",fontWeight:600}}>{cm.faux_negatifs}</div>
            <div style={{fontSize:10,color:C.muted}}>vrais rejetés à tort</div>
          </div>
          <div style={{background:"rgba(45,106,79,0.15)",border:`1px solid rgba(45,106,79,0.4)`,padding:"16px 0",textAlign:"center"}}>
            <div style={{fontSize:24,color:"#5DCAA5",fontWeight:600}}>{cm.vrais_positifs}</div>
            <div style={{fontSize:10,color:C.muted}}>authentiques validés</div>
          </div>
        </div>
      </div>
      {/* Importance des features */}
      <div>
        <h2 style={{fontFamily:"'Montserrat',sans-serif",fontSize:18,color:C.cream,marginBottom:14}}>Importance des features</h2>
        <div style={{display:"flex",flexDirection:"column",gap:9}}>
          {info.importance_features.map(f=>
            <div key={f.feature}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.cream,marginBottom:3}}>
                <span>{f.feature}</span><span style={{color:C.muted}}>{(f.importance*100).toFixed(1)} %</span>
              </div>
              <div style={{height:8,background:"rgba(26,22,20,0.06)"}}>
                <div style={{height:8,width:`${(f.importance/maxImp*100).toFixed(0)}%`,background:C.gold}}></div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>

    <div style={{marginTop:40,padding:"20px 24px",background:"rgba(201,168,76,0.04)",border:`1px solid rgba(201,168,76,0.15)`}}>
      <div style={{fontSize:11,letterSpacing:1,color:C.gold,marginBottom:8}}>NOTE MÉTHODOLOGIQUE</div>
      <p style={{fontSize:12,color:C.muted,lineHeight:1.6,margin:0}}>
        Le modèle est intégré à l'étape 2 du pipeline de vérification. Pour ce prototype, il est entraîné sur un jeu de données généré simulant les signatures visuelles authentique / contrefaçon ; les features sont extraites de pixels réels. Le pipeline (extraction, entraînement, évaluation, déploiement) est prêt à réentraîner sur un dataset réel.
      </p>
    </div>
  </div>;
}
// ═══ ÉCRAN STATISTIQUES ═══
function StatsScreen(){
  const [stats,setStats]=useState(null);
  const [err,setErr]=useState(false);
  useEffect(()=>{ api("/articles/platform/stats").then(setStats).catch(()=>setErr(true)); },[]);

  const C={gold:"#C9A84C",ink:"#1A1614",muted:"rgba(26,22,20,0.45)",green:"#2D6A4F",border:"rgba(26,22,20,0.08)",card:"rgba(26,22,20,0.02)"};
  const catLabels={bags:"Sacs",watches:"Montres",jewelry:"Bijoux",clothing:"Vêtements",eyewear:"Lunettes"};

  if(err) return <div style={{maxWidth:1100,margin:"0 auto",padding:"48px 24px",color:C.muted}}>Impossible de charger les statistiques.</div>;
  if(!stats) return <div style={{maxWidth:1100,margin:"0 auto",padding:"48px 24px",color:C.muted}}>Chargement des statistiques…</div>;

  const v=stats.verification;
  const maxCat=Math.max(...Object.values(stats.par_categorie),1);
  const maxBrand=Math.max(...Object.values(stats.par_marque),1);

  const bigCards=[
    {l:"Articles au catalogue",v:stats.total_articles,c:C.gold},
    {l:"Taux d'auto-validation IA",v:v.taux_auto_validation+" %",c:C.green},
    {l:"Score IA moyen",v:stats.score_ia_moyen,c:C.gold},
    {l:"Valeur du catalogue",v:(stats.valeur_catalogue/1000).toFixed(1)+" k€",c:C.gold},
  ];

  return <div style={{background:"#FAF8F4",minHeight:"calc(100vh - 64px)",color:C.ink}}>
    <div style={{maxWidth:1100,margin:"0 auto",padding:"48px clamp(16px,4vw,32px)"}}>
      <div style={{fontSize:11,letterSpacing:4,color:C.gold,marginBottom:8}}>SUPERVISION DE LA PLATEFORME<span className="api-badge">GET /platform/stats</span></div>
      <h1 style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,fontSize:32,marginBottom:8}}>Statistiques</h1>
      <p style={{fontSize:13,color:C.muted,marginBottom:36}}>Vue d'ensemble en temps réel — données agrégées depuis l'API LUXLOC.</p>

      {/* Grandes cartes */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:36}}>
        {bigCards.map((c,i)=>
          <div key={i} style={{padding:"24px 20px",background:C.card,border:`1px solid ${C.border}`}}>
            <div style={{fontSize:11,letterSpacing:1,color:C.muted,marginBottom:10}}>{c.l.toUpperCase()}</div>
            <div style={{fontSize:32,fontFamily:"'Montserrat',sans-serif",fontWeight:300,color:c.c}}>{c.v}</div>
          </div>
        )}
      </div>

      {/* Ligne secondaire : petites stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,marginBottom:44}}>
        {[
          {l:"Utilisateurs inscrits",v:stats.total_utilisateurs},
          {l:"Locations réalisées",v:stats.total_locations},
          {l:"Revenus de commission",v:stats.revenus_commission+" €"},
        ].map((c,i)=>
          <div key={i} style={{padding:"18px 20px",border:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:12,color:C.muted}}>{c.l}</span>
            <span style={{fontSize:20,fontWeight:600,color:C.ink}}>{c.v}</span>
          </div>
        )}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:40}}>
        {/* Statut de vérification */}
        <div>
          <h2 style={{fontFamily:"'Montserrat',sans-serif",fontSize:18,marginBottom:18}}>Statut de vérification IA</h2>
          {[
            {l:"Vérifiés (auto)",n:v.verifies,col:"#5DCAA5"},
            {l:"En examen expert",n:v.en_examen,col:"#EF9F27"},
            {l:"Rejetés",n:v.rejetes,col:"#E08585"},
          ].map((r,i)=>{
            const tot=v.verifies+v.en_examen+v.rejetes||1;
            return <div key={i} style={{marginBottom:16}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5}}>
                <span>{r.l}</span><span style={{color:C.muted}}>{r.n}</span>
              </div>
              <div style={{height:8,background:"rgba(26,22,20,0.06)"}}>
                <div style={{height:8,width:`${r.n/tot*100}%`,background:r.col,transition:"width 1s ease-out"}}/>
              </div>
            </div>;
          })}
        </div>

        {/* Répartition par catégorie */}
        <div>
          <h2 style={{fontFamily:"'Montserrat',sans-serif",fontSize:18,marginBottom:18}}>Articles par catégorie</h2>
          {Object.entries(stats.par_categorie).sort((a,b)=>b[1]-a[1]).map(([cat,n],i)=>
            <div key={i} style={{marginBottom:13}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
                <span>{catLabels[cat]||cat}</span><span style={{color:C.muted}}>{n}</span>
              </div>
              <div style={{height:8,background:"rgba(26,22,20,0.06)"}}>
                <div style={{height:8,width:`${n/maxCat*100}%`,background:C.gold}}/>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Répartition par marque */}
      <div style={{marginTop:44}}>
        <h2 style={{fontFamily:"'Montserrat',sans-serif",fontSize:18,marginBottom:18}}>Maisons représentées</h2>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px 40px"}}>
          {Object.entries(stats.par_marque).map(([brand,n],i)=>
            <div key={i}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
                <span>{brand}</span><span style={{color:C.muted}}>{n}</span>
              </div>
              <div style={{height:6,background:"rgba(26,22,20,0.06)"}}>
                <div style={{height:6,width:`${n/maxBrand*100}%`,background:"#6D2E46"}}/>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  </div>;
}

// ═══ APP ═══
function App(){
// ═══ APP ═══
function App(){
  const [screen,setScreen]=useState(SCREENS.AUTH);
  const [articles,setArticles]=useState([]);
  const [user,setUser]=useState(null);
  const [verifResult,setVerifResult]=useState(null);
  const [selectedArticle,setSelectedArticle]=useState(null);
  const [txData,setTxData]=useState(null);
  const [toast,setToast]=useState(null);
  const [stats,setStats]=useState({articles:0});
  const showToast=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),3500);},[]);

  const handleLogin = async (u) => {
    setUser(u);
    setScreen(SCREENS.LANDING);
    try {
      const arts = await api("/articles/?verified_only=false&limit=50");
      setArticles(arts);
      setStats({articles:arts.length});
    } catch(e) {}
  };

  const handleLogout = () => {
    setUser(null);
    setScreen(SCREENS.AUTH);
  };

  useEffect(()=>{
    if(screen===SCREENS.RENTER_BROWSE && user) api("/articles/?verified_only=false&limit=50").then(setArticles).catch(()=>{});
  },[screen]);

  return <div>
    {screen!==SCREENS.AUTH&&<ScrollProgress/>}
    {screen===SCREENS.AUTH&&<AuthScreen onLogin={handleLogin} showToast={showToast}/>}
    {screen!==SCREENS.AUTH&&<Nav screen={screen} setScreen={setScreen} user={user} onLogout={handleLogout}/>}
    {screen===SCREENS.LANDING&&<Landing setScreen={setScreen} articles={articles} stats={stats}/>}
    {screen===SCREENS.OWNER_VERIFY&&<OwnerVerify setScreen={setScreen} setVerifResult={setVerifResult} showToast={showToast} user={user}/>}
    {screen===SCREENS.OWNER_RESULT&&<OwnerResult setScreen={setScreen} verifResult={verifResult} showToast={showToast}/>}
    {screen===SCREENS.OWNER_DASHBOARD&&<OwnerDashboard setScreen={setScreen} user={user} showToast={showToast}/>}
    {screen===SCREENS.RENTER_BROWSE&&<RenterBrowse setScreen={setScreen} articles={articles} setSelectedArticle={setSelectedArticle}/>}
    {screen===SCREENS.RENTER_DETAIL&&<RenterDetail setScreen={setScreen} article={selectedArticle} showToast={showToast} user={user} setTxData={setTxData}/>}
    {screen===SCREENS.RENTER_PAYMENT&&<RenterPayment setScreen={setScreen} article={selectedArticle} txData={txData} showToast={showToast}/>}
    {screen===SCREENS.RENTER_PROFILE&&<RenterProfile setScreen={setScreen} user={user} showToast={showToast}/>}
    {screen===SCREENS.RENTER_RETURN&&<RenterReturn setScreen={setScreen} showToast={showToast}/>}
    {screen===SCREENS.STATS&&<StatsScreen/>}
    {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
  </div>
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
