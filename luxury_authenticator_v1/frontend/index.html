<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LuxLoc Authenticator</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #aaa;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            background: #f5f5f5;
            display: none;
        }

        .score {
            font-size: 28px;
            font-weight: bold;
        }

        .warning {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

    </style>

</head>


<body>

    <h1>LuxLoc AI Authenticator</h1>

    <div class="subtitle">
        Internal AI-assisted authenticity assessment
    </div>


    <div class="upload-box">

        <input
            type="file"
            id="image"
            accept="image/*"
        >

        <br>

        <button
            onclick="analyze()"
        >
            Analyze item
        </button>

    </div>


    <div id="result">

        <h2 id="verdict"></h2>

        <p>
            Fake probability:
            <span id="fake"></span>
        </p>

        <p>
            Real probability:
            <span id="real"></span>
        </p>

        <p class="score">
            Confidence:
            <span id="confidence"></span>
        </p>

        <div class="warning">
            ⚠ AI result is advisory only.
            Final authentication must be performed by a LuxLoc expert.
        </div>

    </div>


<script>

async function analyze() {

    const input =
        document.getElementById("image");

    if (!input.files.length) {

        alert("Please select an image.");

        return;
    }

    const formData =
        new FormData();

    formData.append(
        "file",
        input.files[0]
    );


    const response =
        await fetch(
            "/predict",
            {
                method: "POST",
                body: formData
            }
        );


    const data =
        await response.json();


    document.getElementById(
        "result"
    ).style.display = "block";


    document.getElementById(
        "verdict"
    ).innerText =
        data.verdict;


    document.getElementById(
        "fake"
    ).innerText =
        (data.fake_probability * 100)
        .toFixed(2) + "%";


    document.getElementById(
        "real"
    ).innerText =
        (data.real_probability * 100)
        .toFixed(2) + "%";


    document.getElementById(
        "confidence"
    ).innerText =
        (data.confidence * 100)
        .toFixed(2) + "%";
}

</script>

</body>

</html>
